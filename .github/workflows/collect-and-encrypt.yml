name: Collect & Encrypt Configs

on:
  schedule:
    - cron: "*/20 * * * *"   
  workflow_dispatch:         

permissions:
  contents: write

jobs:
  collect-and-encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography

      - name: Encrypt configs.txt
        env:
          AES_KEY_HEX: ${{ secrets.CONFIGS_AES_KEY }}   
        run: python scripts/encrypt_configs.py

      
      - name: Commit encrypted file only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs.enc
          git rm --cached configs.txt --ignore-unmatch
          git commit -m "chore: update encrypted configs [skip ci]" || echo "چیزی برای کامیت نیست"
          git push
